<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Featherfield Preserve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">Featherfield Preserve</h1>
            <p class="text-muted text-center small mb-4">Sign in with your <strong>username</strong> (the one you registered, not an email).</p>
            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required minlength="3" autocomplete="username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required minlength="6" autocomplete="current-password">
              </div>
              <button type="submit" class="btn btn-success w-100 mb-2">Log in</button>
            </form>
            <a href="{{ url_for('register_page') }}" class="btn btn-outline-primary w-100 mb-2">Create an account</a>
            <a href="{{ url_for('index') }}" class="btn btn-link w-100 text-decoration-none">Back to game</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    $("#loginForm").on("submit", function (e) {
      e.preventDefault();
      $("#loginError").addClass("d-none");
      const username = $("#username").val().trim();
      const password = $("#password").val();
      $.ajax({
        url: "/api/login",
        method: "POST",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify({ username: username, password: password }),
      })
        .done(function (res) {
          if (res.ok) {
            window.location.href = "/";
          }
        })
        .fail(function (xhr) {
          const msg = (xhr.responseJSON && xhr.responseJSON.error) || "Could not log in.";
          $("#loginError").text(msg).removeClass("d-none");
        });
    });
  </script>
</body>
</html>
